<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presentation</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  {% if images %}
    <main class="gallery">
      {% for image in images %}
        <img src="{{ url_for('static', filename='images/' + image) }}" alt="" loading="lazy">
      {% endfor %}
    </main>
  {% else %}
    <div class="empty">No images yet.</div>
  {% endif %}
</body>
</html>
