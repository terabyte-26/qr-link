<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f3e6cb">
  <title>Altarys Group — Our Projects</title>

  <meta name="description" content="Scan to access Altarys Group's project presentations: 5th Avenue, Alhambra, Crystal Garden, Da Vinci, Jardin de Bali, Les Jardins Blancs, Little Mountain, M Road Park and Triangle.">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Altarys Group — Our Projects">
  <meta property="og:description" content="Tap a project to view its full presentation.">
  <meta property="og:url" content="{{ request.url_root }}">
  <meta property="og:image" content="{{ request.url_root }}qr.png">
  <meta property="og:image:secure_url" content="{{ request.url_root }}qr.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="820">
  <meta property="og:image:height" content="820">
  <meta property="og:image:alt" content="Altarys Group QR code">
  <meta property="og:site_name" content="Altarys Group">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Altarys Group — Our Projects">
  <meta name="twitter:description" content="Tap a project to view its full presentation.">
  <meta name="twitter:image" content="{{ request.url_root }}qr.png">

  <link rel="icon" type="image/png" href="{{ url_for('static', filename='altaris_logo.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="container">
    <header class="page-header">
      <img class="brand-logo"
           src="{{ url_for('static', filename='altaris_logo.png') }}"
           alt="Altarys Group">
      <h1 class="title">Our Projects</h1>
      <p class="subtitle">Select a project to view its full presentation</p>
    </header>

    <nav class="cards" aria-label="Projects">
      {% for name, url in venues %}
        <a class="card" href="{{ url }}" target="_blank" rel="noopener noreferrer"
           style="animation-delay: {{ 240 + loop.index0 * 70 }}ms">
          <span class="card-name">{{ name }}</span>
          <span class="card-arrow" aria-hidden="true">›</span>
        </a>
      {% endfor %}
    </nav>
  </main>
</body>
</html>
